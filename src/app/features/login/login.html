<div class="cadastro-container">

  <mat-card class="cadastro-card">

    <mat-card-header>
      <mat-card-title>Entrar</mat-card-title>
      <mat-card-subtitle>
        Acesse sua conta
      </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>

      <form [formGroup]="form" (ngSubmit)="logar()">

        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input
            matInput
            formControlName="email"
            type="email"
            placeholder="seu@email.com">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Senha</mat-label>
          <input
            matInput
            formControlName="senha"
            type="password"
            placeholder="Digite sua senha">
        </mat-form-field>

        <button
          mat-raised-button
          color="primary"
          type="submit">
          Entrar
        </button>

      </form>

    </mat-card-content>

  </mat-card>

</div>
