<div class="busca">

  <mat-form-field appearance="outline">
    <mat-label>Digite uma cidade</mat-label>

    <input
      matInput
      type="text"
      [(ngModel)]="searchQuery"
      (keyup.enter)="buscarCidade()"
      placeholder="Ex: São José do Rio Preto">
  </mat-form-field>

  <button
    mat-raised-button
    color="primary"
    (click)="buscarCidade()">

    <mat-icon>search</mat-icon>
    Buscar

  </button>

</div>


@if (clima$ | async; as clima) {
  <app-card-previsao-tempo
    [favorito]="false"
    [clima]="clima">
  </app-card-previsao-tempo>
}
